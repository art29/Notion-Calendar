name: Test & Deploy
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notion_calendar
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Using NodeJS 25.x
        uses: actions/setup-node@v7
        with:
          node-version: 25.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Running Prettier
        run: yarn run prettier:check
      - name: Run Lint
        run: yarn run lint
  deploy:
    needs: test
    name: Deploy on Main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            sh deploy-notion-calendar.sh
